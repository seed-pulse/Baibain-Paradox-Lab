name: Flight 001 model checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python and run deterministic model tests
        run: |
          python3 --version
          python3 -m unittest discover -s tests -v
          python3 model.py --milestones
